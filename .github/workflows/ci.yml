name: CI Pipeline

on:
  push:
    branches: [ "master", "main", "lab*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Decode Keystore
      run: |
        mkdir -p src/main/resources
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/server.p12

    - name: Build and Test
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: restaurant_db
        DB_USER: postgres
        DB_PASSWORD: postgres
      run: mvn -B package

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-jar
        path: target/*.jar
